name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: suite (in devcontainer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Build the devcontainer (EigenScript pinned by .devcontainer/Dockerfile's
      # EIGS_REF) and run the suite inside it — the same image a Codespace opens.
      - name: Build devcontainer and run suite
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            set -e
            # Glob, not a hardcoded list: round-9 review showed a script
            # dropped from an inline enumeration keeps CI green silently.
            # The count assertion makes a missing/unglobbed script loud.
            N=0
            for t in tests/test_*.sh; do
              echo "=== $t"
              EIGENSCRIPT=eigenscript bash "$t"
              N=$((N+1))
            done
            [ "$N" -ge 8 ] || { echo "FAIL: only $N test scripts found"; exit 1; }
